<!DOCTYPE html>
<html>
<head>
    <title>Number Plate Reader</title>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .card{
            background:white;
            width:100%;
            max-width:500px;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        input[type=file]{
            width:100%;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        img{
            width:100%;
            margin-top:15px;
            border-radius:10px;
            display:none;
        }

        #result{
            margin-top:20px;
            padding:15px;
            background:#f8fafc;
            border-radius:10px;
            min-height:80px;
            text-align:center;
            font-size:18px;
            font-weight:bold;
            word-break:break-word;
        }
    </style>

</head>
<body>

<div class="card">

    <h1>🚗 Number Plate Reader</h1>

    <input
        type="file"
        id="vehicleImage"
        accept="image/*"
        capture="environment">

    <button onclick="readPlate()">
        📷 Read Number Plate
    </button>

    <img id="preview">

    <div id="result">
        Take a photo of a vehicle number plate
    </div>

</div>

<script>

document
.getElementById("vehicleImage")
.addEventListener("change", function(event){

    const file = event.target.files[0];

    if(file){

        const preview =
            document.getElementById("preview");

        preview.src =
            URL.createObjectURL(file);

        preview.style.display =
            "block";
    }
});

async function readPlate(){

    const file =
        document
        .getElementById("vehicleImage")
        .files[0];

    if(!file){

        alert(
            "Please select or capture an image first"
        );

        return;
    }

    const resultDiv =
        document.getElementById("result");

    resultDiv.innerHTML =
        "🔍 Reading number plate...";

    try{

        const result =
            await Tesseract.recognize(
                file,
                "eng"
            );

        const rawText =
            result.data.text;

        const cleanedText =
            rawText
            .toUpperCase()
            .replace(/[^A-Z0-9]/g,'');

        console.log(
            "RAW OCR:",
            rawText
        );

        console.log(
            "CLEANED:",
            cleanedText
        );

        resultDiv.innerHTML =
            `
            <div>
                <b>Detected Text:</b>
                <br><br>
                ${cleanedText}
            </div>
            `;

    }
    catch(error){

        console.error(error);

        resultDiv.innerHTML =
            "❌ Failed to read image";
    }
}

</script>

</body>
</html>

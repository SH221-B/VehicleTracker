<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Society Vehicle Lookup</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}.app{max-width:480px;min-height:100vh;margin:auto;background:white}header{background:#123b63;color:white;padding:30px 20px;text-align:center}.logo{font-size:38px}h1{font-size:24px;margin:10px 0 6px}header p{margin:0;color:#dbeafe}main{padding:24px 20px}label{display:block;font-weight:bold;margin-bottom:10px}input{width:100%;padding:16px;border:1px solid #cbd5e1;border-radius:10px;font-size:18px;text-transform:uppercase}button{width:100%;margin-top:14px;padding:16px;border:0;border-radius:10px;background:#167347;color:white;font-size:18px;font-weight:bold;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#result{margin-top:22px}.result-card{padding:18px;border:1px solid #dbe3ed;border-radius:12px;background:#f8fafc}.result-card h2{margin-top:0;font-size:20px}.detail{padding:10px 0;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}.detail:last-child{border-bottom:0}.detail strong{display:block;color:#64748b;font-size:13px;margin-bottom:4px}.found{color:#166534;font-weight:bold}.not-found{color:#b91c1c;background:#fef2f2;padding:16px;border-radius:10px}footer{padding:18px;text-align:center;color:#64748b;font-size:13px}#loginScreen{padding:24px 20px;max-width:480px;margin:auto}#loginScreen h2{margin-top:0}#loginScreen input{margin-bottom:14px;text-transform:none}.hint,#ocrStatus,#loginMessage{font-size:13px;line-height:1.45;overflow-wrap:anywhere}.camera-button{background:#123b63}#photoPreview{display:none;width:100%;max-height:260px;object-fit:contain;margin-top:14px;border-radius:10px;border:1px solid #dbe3ed}
</style></head><body><div class="app">
<header><div class="logo">🏢</div><h1>Society Vehicle Lookup</h1><p>Gatekeeper Parking Assistant</p></header>
<section id="loginScreen"><h2>Gatekeeper Login</h2><label for="loginEmail">Email Address</label><input id="loginEmail" type="email" placeholder="Enter your email" autocomplete="username"><label for="loginPassword">Password</label><input id="loginPassword" type="password" placeholder="Enter your password" autocomplete="current-password"><button id="loginBtn" type="button">Login</button><p id="loginMessage" role="status"></p></section>
<main hidden><label for="vehicleNumber">Vehicle Registration Number</label><input id="vehicleNumber" type="text" placeholder="e.g. MH01AB1234" autocomplete="off"><button id="searchBtn" type="button">Search Vehicle</button><button id="photoBtn" class="camera-button" type="button">📷 Take Photo of Number Plate</button><input id="photoInput" type="file" accept="image/*" capture="environment" hidden><p class="hint">Take a clear, close-up photo of the number plate. The app will read the text and search automatically. OCR can make mistakes, so check the number before relying on the result.</p><img id="photoPreview" alt="Captured vehicle number plate preview"><p id="ocrStatus" role="status" aria-live="polite"></p><div id="result" aria-live="polite"></div></main>
<footer>Society Security • Vehicle Records</footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://eqjvbgzsxpxrmoebpfzy.supabase.co";
const SUPABASE_KEY="sb_publishable_P4nTDrYikCBvhjQtba9dwQ_vwUVo7d1";
function initializeApp(){
 if(!window.supabase){alert("Could not load Supabase. Check your internet connection.");return}
 const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const $=id=>document.getElementById(id), input=$("vehicleNumber"),result=$("result"),main=document.querySelector("main"),login=$("loginScreen"),loginMsg=$("loginMessage"),loginBtn=$("loginBtn"),password=$("loginPassword"),searchBtn=$("searchBtn"),photoBtn=$("photoBtn"),photoInput=$("photoInput"),preview=$("photoPreview"),ocrStatus=$("ocrStatus");
 async function signIn(){
  const email=$("loginEmail").value.trim(),pass=password.value;
  if(!email||!pass){loginMsg.textContent="Enter your email and password.";return}
  loginBtn.disabled=true;loginMsg.textContent="Signing in...";
  try{const {error}=await client.auth.signInWithPassword({email,password:pass});if(error){loginMsg.textContent="Login failed. Check your credentials and try again.";console.error(error)}else loginMsg.textContent=""}
  catch(e){console.error(e);loginMsg.textContent="Unable to connect. Please try again."}
  finally{loginBtn.disabled=false}
 }
 loginBtn.addEventListener("click",signIn);password.addEventListener("keydown",e=>{if(e.key==="Enter")signIn()});
 function detail(label,value){const row=document.createElement("div");row.className="detail";const title=document.createElement("strong");title.textContent=label;row.append(title,document.createTextNode(value||"Not available"));return row}
 async function searchVehicle(){
  const number=input.value.trim().toUpperCase().replace(/\s+/g,"");
  if(!number){result.className="not-found";result.textContent="Please enter a vehicle number.";return}
  input.value=number;result.className="";result.textContent="Searching database...";searchBtn.disabled=true;
  try{
   const {data,error}=await client.rpc("lookup_vehicle",{p_vehicle_number:number});
   if(error){console.error(error);result.className="not-found";result.textContent="Search failed. Check database function permissions.";return}
   if(!data||!data.length){result.className="not-found";result.textContent="Vehicle not found. Check the number and try again.";return}
   result.className="";result.replaceChildren();
   if(data.length>1){const note=document.createElement("p");note.textContent="Multiple vehicles end with "+number.slice(-4)+". Check the full registration number and choose the correct match:";result.appendChild(note)}
   data.forEach(v=>{
    const card=document.createElement("div");card.className="result-card";card.style.marginBottom="12px";
    const h=document.createElement("h2");h.className="found";h.textContent="✓ "+v.vehicle_number;card.appendChild(h);
    const rows=[["Vehicle Type",v.vehicle_type],["Parking Number",v.parking_number],["Flat Number",v.flat_number],["Parking Type",v.parking_type],["Flat Owner",v.owner_name],["Owner Mobile",v.owner_mobile]];
    if(v.parking_type==="Rented")rows.push(["Parking Rented By",v.rented_by_name],["Renter Mobile",v.rented_by_mobile]);
    rows.forEach(r=>card.appendChild(detail(r[0],r[1])));result.appendChild(card);
   });
  }catch(e){console.error(e);result.className="not-found";result.textContent="Unable to connect. Please try again."}
  finally{searchBtn.disabled=false}
 }
 searchBtn.addEventListener("click",searchVehicle);input.addEventListener("keydown",e=>{if(e.key==="Enter")searchVehicle()});
 function plateCandidates(text){
  const s=String(text||"").toUpperCase().replace(/[|]/g,"I").replace(/[^A-Z0-9]/g,""),out=[];
  for(const re of [/[A-Z]{2}[0-9]{1,2}[A-Z]{1,3}[0-9]{1,4}/g,/[0-9]{2}BH[0-9]{4}[A-Z]{1,2}/g])for(const m of s.match(re)||[])if(!out.includes(m))out.push(m);
  return out
 }
 async function recognizeOneImage(file){
  const form=new FormData();form.append("image",file,file.name||"plate.jpg");
  const {data,error}=await client.functions.invoke("recognize-plate",{body:form});
  if(error){console.error("OCR function error:",error);throw Error("Plate recognition request failed. Check function logs and try again.");}
  const payload=data||{},root=payload.data||payload.result||payload;
  const number=root.plate_number||root.number||root.registration_number||root.registrationNumber||root.plate||"";
  const normalized=String(number).toUpperCase().replace(/[^A-Z0-9]/g,"");
  return {number:normalized,raw:JSON.stringify(payload),confidence:root.confidence??root.ocr_confidence??null};
 }
 async function recognizeIndianPlate(file){
  if(file.size>5*1024*1024)throw Error("Photo must be 5 MB or smaller.");
  ocrStatus.textContent="Reading number plate…";
  // One image and one API call keeps recognition fast.
  return await recognizeOneImage(file);
 }
 photoBtn.addEventListener("click",()=>photoInput.click());
 photoInput.addEventListener("change",async()=>{
  const file=photoInput.files&&photoInput.files[0];if(!file)return;
  result.replaceChildren();result.className="";preview.src=URL.createObjectURL(file);preview.style.display="block";photoBtn.disabled=true;searchBtn.disabled=true;ocrStatus.textContent="Reading number plate… first use may take a little while.";
  try{
   const recognized=await recognizeIndianPlate(file),candidates=plateCandidates(recognized.number);
   if(candidates.length===1 && candidates[0].length>=4){
    input.value=candidates[0];
    const confidence=recognized.confidence!==null?" (confidence "+Math.round(Number(recognized.confidence)*100)+"%)":"";
    ocrStatus.textContent=(candidates[0].length===4?"Detected last four digits ":"Detected ")+candidates[0]+confidence+". Searching database…";
    await searchVehicle()
   }else{
    input.value=recognized.number;
    ocrStatus.textContent=recognized.number
      ?"Only part of the plate was detected ("+recognized.number+"). Please enter the complete registration number and tap Search Vehicle."
      :"Could not identify a plate. Try a clearer, closer photo.";
   }
  }catch(e){
   console.error(e);
   ocrStatus.textContent=e.message&&e.message.includes("Add your Parkese")
    ?"OCR setup or service error. Check the Supabase Edge Function logs and try again."
    :e.message&&e.message.includes("5 MB")
     ?e.message
     :"Could not read the photo. Check the Edge Function deployment, internet connection, and photo, then try again.";
  }
  finally{photoBtn.disabled=false;searchBtn.disabled=false;photoInput.value=""}
 });
 const logout=document.createElement("button");logout.type="button";logout.textContent="Logout";logout.style.cssText="margin:0 20px 20px;width:calc(100% - 40px)";logout.hidden=true;main.after(logout);
 logout.addEventListener("click",async()=>{await client.auth.signOut();input.value="";result.replaceChildren();result.className="";ocrStatus.textContent="";preview.style.display="none";preview.removeAttribute("src");password.value="";loginMsg.textContent="You have logged out."});
 function screen(session){const ok=!!session;login.hidden=ok;main.hidden=!ok;logout.hidden=!ok;if(ok)input.focus()}
 client.auth.onAuthStateChange((event,session)=>screen(session));client.auth.getSession().then(({data,error})=>{if(error)console.error(error);screen(data&&data.session)});
}
if(window.supabase)initializeApp();else document.querySelector('script[src*="supabase-js"]').addEventListener("load",initializeApp,{once:true});
</script></body></html>
